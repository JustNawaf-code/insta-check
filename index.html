<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بحث بيانات الطالب</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
–bg:        #0a0f1e;
–surface:   #111827;
–border:    #1e293b;
–accent:    #38bdf8;
–accent2:   #818cf8;
–gold:      #fbbf24;
–text:      #f1f5f9;
–muted:     #64748b;
–success:   #10b981;
–error:     #ef4444;
}

body {
font-family: ‘Tajawal’, sans-serif;
background: var(–bg);
color: var(–text);
min-height: 100vh;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 2rem 1rem;
position: relative;
overflow-x: hidden;
}

/* Ambient background */
body::before {
content: ‘’;
position: fixed;
inset: 0;
background:
radial-gradient(ellipse 60% 40% at 20% 20%, rgba(56,189,248,.07) 0%, transparent 60%),
radial-gradient(ellipse 50% 50% at 80% 80%, rgba(129,140,248,.07) 0%, transparent 60%);
pointer-events: none;
}

.card {
background: var(–surface);
border: 1px solid var(–border);
border-radius: 20px;
padding: 2.5rem 2rem;
width: 100%;
max-width: 480px;
position: relative;
box-shadow: 0 25px 60px rgba(0,0,0,.5);
}

.logo {
text-align: center;
margin-bottom: 2rem;
}
.logo-icon {
width: 56px; height: 56px;
background: linear-gradient(135deg, var(–accent), var(–accent2));
border-radius: 14px;
display: inline-flex; align-items: center; justify-content: center;
font-size: 1.6rem;
margin-bottom: .75rem;
box-shadow: 0 0 30px rgba(56,189,248,.25);
}
.logo h1 { font-size: 1.4rem; font-weight: 800; letter-spacing: -.5px; }
.logo p  { font-size: .85rem; color: var(–muted); margin-top: .25rem; }

.field-wrap { margin-bottom: 1.25rem; }
label { display: block; font-size: .8rem; font-weight: 500; color: var(–muted); margin-bottom: .45rem; }

input[type=“text”] {
width: 100%;
background: var(–bg);
border: 1.5px solid var(–border);
border-radius: 10px;
padding: .8rem 1rem;
font-family: ‘Tajawal’, sans-serif;
font-size: 1.05rem;
color: var(–text);
letter-spacing: .1em;
transition: border-color .2s, box-shadow .2s;
outline: none;
text-align: center;
}
input[type=“text”]:focus {
border-color: var(–accent);
box-shadow: 0 0 0 3px rgba(56,189,248,.15);
}

button {
width: 100%;
padding: .9rem;
background: linear-gradient(135deg, var(–accent), var(–accent2));
border: none; border-radius: 10px;
color: #fff; font-family: ‘Tajawal’, sans-serif;
font-size: 1rem; font-weight: 700;
cursor: pointer;
transition: opacity .2s, transform .1s;
margin-top: .5rem;
}
button:hover  { opacity: .9; }
button:active { transform: scale(.98); }
button:disabled { opacity: .5; cursor: not-allowed; }

/* Loader */
.loader {
display: none;
text-align: center;
padding: 1.5rem 0;
color: var(–muted);
font-size: .9rem;
}
.spinner {
width: 36px; height: 36px;
border: 3px solid var(–border);
border-top-color: var(–accent);
border-radius: 50%;
animation: spin .7s linear infinite;
margin: 0 auto .75rem;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Error */
.error-box {
display: none;
background: rgba(239,68,68,.1);
border: 1px solid rgba(239,68,68,.3);
border-radius: 10px;
padding: .8rem 1rem;
font-size: .88rem;
color: var(–error);
margin-top: 1rem;
text-align: center;
}

/* Result */
.result-box {
display: none;
margin-top: 1.5rem;
background: var(–bg);
border: 1px solid var(–border);
border-radius: 14px;
overflow: hidden;
animation: fadeUp .4s ease;
}
@keyframes fadeUp {
from { opacity:0; transform: translateY(10px); }
to   { opacity:1; transform: translateY(0); }
}

.result-header {
background: linear-gradient(135deg, rgba(56,189,248,.15), rgba(129,140,248,.15));
padding: 1rem 1.25rem;
border-bottom: 1px solid var(–border);
}
.result-name {
font-size: 1.2rem;
font-weight: 800;
color: var(–text);
line-height: 1.3;
}
.result-id {
font-size: .78rem;
color: var(–muted);
margin-top: .2rem;
direction: ltr;
text-align: right;
}
.result-nat {
font-size: .78rem;
color: var(–accent);
margin-top: .15rem;
}

.scores {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 1px;
background: var(–border);
}
.score-cell {
background: var(–surface);
padding: 1rem 1.25rem;
text-align: center;
}
.score-label {
font-size: .75rem;
color: var(–muted);
margin-bottom: .4rem;
font-weight: 500;
}
.score-value {
font-size: 2rem;
font-weight: 800;
background: linear-gradient(135deg, var(–gold), #f59e0b);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
background-clip: text;
line-height: 1;
}
.score-value.blue {
background: linear-gradient(135deg, var(–accent), var(–accent2));
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
background-clip: text;
}

.divider { height: 1px; background: var(–border); }

.note { font-size: .75rem; color: var(–muted); text-align: center; margin-top: 1.5rem; line-height: 1.6; }
</style>

</head>
<body>

<div class="card">
  <div class="logo">
    <div class="logo-icon">🎓</div>
    <h1>بوابة الطالب</h1>
    <p>الاستعلام عن بيانات القبول</p>
  </div>

  <div class="field-wrap">
    <label for="idInput">رقم الهوية الوطنية</label>
    <input type="text" id="idInput" placeholder="1XXXXXXXXX" maxlength="10" inputmode="numeric"
           oninput="this.value=this.value.replace(/\D/g,'')">
  </div>

<button id="searchBtn" onclick="doSearch()">🔍 بحث</button>

  <div class="loader" id="loader">
    <div class="spinner"></div>
    جاري الاستعلام...
  </div>

  <div class="error-box" id="errorBox"></div>

  <div class="result-box" id="resultBox">
    <div class="result-header">
      <div class="result-name" id="resName">—</div>
      <div class="result-id" id="resId"></div>
      <div class="result-nat" id="resNat"></div>
    </div>
    <div class="scores">
      <div class="score-cell">
        <div class="score-label">القدرات</div>
        <div class="score-value blue" id="resCap">—</div>
      </div>
      <div class="score-cell">
        <div class="score-label">التحصيلي</div>
        <div class="score-value" id="resTah">—</div>
      </div>
    </div>
  </div>

  <p class="note">⚠️ البيانات المعروضة من بوابة فيجن التعليمية<br>للاستخدام الشخصي فقط</p>
</div>

<script>
async function doSearch() {
  const id = document.getElementById('idInput').value.trim();
  const btn = document.getElementById('searchBtn');
  const loader = document.getElementById('loader');
  const errorBox = document.getElementById('errorBox');
  const resultBox = document.getElementById('resultBox');

  // Reset
  errorBox.style.display = 'none';
  resultBox.style.display = 'none';

  if (!/^\d{10}$/.test(id)) {
    showError('يرجى إدخال رقم هوية صحيح مكون من 10 أرقام');
    return;
  }

  btn.disabled = true;
  loader.style.display = 'block';

  try {
    const res = await fetch('fetch.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id })
    });

    const json = await res.json();

    if (json.error) {
      showError(json.error);
      return;
    }

    const d = json.data;
    document.getElementById('resName').textContent = d.full_name || 'الاسم غير متوفر';
    document.getElementById('resId').textContent    = 'رقم الهوية: ' + d.id;
    document.getElementById('resNat').textContent   = '🌍 ' + (d.nationality || '');
    document.getElementById('resCap').textContent   = d.cap_score !== 'لم يختبر بعد' ? d.cap_score + ' %' : d.cap_score;
    document.getElementById('resTah').textContent   = d.tah_score !== 'لم يختبر بعد' ? d.tah_score + ' %' : d.tah_score;

    resultBox.style.display = 'block';

  } catch (e) {
    showError('حدث خطأ في الاتصال، حاول مرة أخرى');
  } finally {
    btn.disabled = false;
    loader.style.display = 'none';
  }
}

function showError(msg) {
  const box = document.getElementById('errorBox');
  box.textContent = msg;
  box.style.display = 'block';
}

document.getElementById('idInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});
</script>

</body>
</html>
